name: Release

# 태그 v* push → verify-static ∥ verify-e2e → GitHub Release 생성(멱등). npm publish 는 하지 않는다(소유자가 최종 버전만 로컬에서 게시).
# workflow_dispatch: 기존 태그 재실행/소급 릴리스 (입력 tag, 예: v1.3.1). 워크플로 파일은 선택한 브랜치(main)의 것이 쓰인다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스할 기존 태그 (예: v1.3.1)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # pnpm-workspace.yaml의 allowBuilds는 pnpm 10.26+ 문법 — 구버전(9)은 "packages field missing"으로 실패한다
  PNPM_VERSION: 10.26.0
  NODE_VERSION: 22
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # 태그 커밋이 기본 브랜치에 포함되는지 검사(merge-base)

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Static release checks
        run: node scripts/verify-static.mjs --tag "$TAG" --allow-published

  verify-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 캐시 적중 시 브라우저 다운로드는 건너뛰고 OS 의존 패키지만 설치된다
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # npm pack tarball을 풀어 그 안의 dist/vue-zero.js로 E2E 실행 (저장소 파일이 아니라 실제 산출물 검증)
      - name: E2E against packed tarball
        run: node scripts/verify-e2e.mjs

      # playwright.config.js: outputDir=test/.results (실패 트레이스 포함), CI reporter는 list+github(HTML 리포트 없음)
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test/.results/
          if-no-files-found: ignore
          retention-days: 14

  # npm 게시와 무관하다: npm 에 없는 버전(1.3.1 등)도 태그가 있고 두 게이트를 통과하면 Release 가 만들어진다.
  github-release:
    needs: [verify-static, verify-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Release 생성은 이 잡에만 부여
    steps:
      # 노트는 태그 커밋이 아니라 기본 브랜치의 CHANGELOG.md 에서 추출한다(소급 정정 가능)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/changelog.mjs "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"

      # 조회 실패(네트워크 등)면 줄을 생략한다. 404 는 "미게시"
      - name: Append npm status line
        run: |
          version="${TAG#v}"
          if out=$(npm view "vue-zero-ai@$version" version --ignore-scripts 2>&1); then
            if [ "$out" = "$version" ]; then
              printf '\nnpm: 게시됨\n' >> "$RUNNER_TEMP/release-notes.md"
            fi
          elif printf '%s' "$out" | grep -qE 'E404|404 Not Found|is not in this registry'; then
            printf '\nnpm: 이 버전은 npm 에 게시되지 않았습니다(소유자가 최종 버전만 별도로 게시)\n' >> "$RUNNER_TEMP/release-notes.md"
          else
            echo "npm 조회 실패 — npm 상태 줄 생략: $out"
          fi

      # 재실행 멱등: 이미 Release 가 있으면 노트만 갱신
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 이미 존재 — 노트만 갱신"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
