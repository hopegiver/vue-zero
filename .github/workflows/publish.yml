name: Publish to npm

# 태그 v* push → verify-static ∥ verify-e2e → publish → post-publish → GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # pnpm-workspace.yaml의 allowBuilds는 pnpm 10.26+ 문법 — 구버전(9)은 "packages field missing"으로 실패한다
  PNPM_VERSION: 10.26.0
  NODE_VERSION: 22

jobs:
  verify-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 태그 커밋이 기본 브랜치에 포함되는지 검사(merge-base)

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Static release checks
        run: node scripts/verify-static.mjs --tag "$GITHUB_REF_NAME"

  verify-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 캐시 적중 시 브라우저 다운로드는 건너뛰고 OS 의존 패키지만 설치된다
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # npm pack tarball을 풀어 그 안의 dist/vue-zero.js로 E2E 실행 (저장소 파일이 아니라 실제 산출물 검증)
      - name: E2E against packed tarball
        run: node scripts/verify-e2e.mjs

      # playwright.config.js: outputDir=test/.results (실패 트레이스 포함), CI reporter는 list+github(HTML 리포트 없음)
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test/.results/
          if-no-files-found: ignore
          retention-days: 14

  # 이 잡은 install/build 없이 태그 커밋에 커밋된 dist를 그대로 게시한다.
  # verify-static이 "커밋된 dist == 재빌드 결과"를, verify-e2e가 그 dist의 tarball을 검증했으므로 검증본 == 게시본.
  publish:
    needs: [verify-static, verify-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing(OIDC)은 npm >= 11.5.1 필요. 고정 버전만 설치한다(@latest 금지).
      - name: Pin npm CLI for trusted publishing
        run: npm install -g npm@11.5.1 --ignore-scripts

      # publish 전 방어: 작업 트리가 태그 커밋 그대로이고 dist가 커밋본과 동일해야 한다(재빌드 없음)
      - name: Assert dist is the committed file
        run: |
          test -z "$(git status --porcelain)"
          git cat-file -p "HEAD:dist/vue-zero.js" | cmp - dist/vue-zero.js

      - run: npm publish --provenance

  post-publish:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 레지스트리 전파 지연을 고려해 재시도(기본 18회 x 10초), 게시 tarball의 dist == 태그 커밋의 dist
      - name: Verify published package
        run: node scripts/verify-published.mjs "${GITHUB_REF_NAME#v}"

  github-release:
    needs: post-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Release 생성은 이 잡에만 부여
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/changelog.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # 재실행 멱등: 이미 Release가 있으면 건너뜀
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 이미 존재 — 건너뜀"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
